<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
  <title id="title">Hometer AI Product Manager profile</title>
  <desc id="desc">Animated terminal introduction for an AI Product Manager</desc>
  <style>
    :root { color-scheme: light; }
    .window { fill: #ffffff; stroke: #d0d7de; stroke-width: 2; }
    .bar { fill: #ffffff; }
    .divider { stroke: #d8dee4; stroke-width: 1; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "PingFang SC", monospace; }
    .meta { fill: #57606a; font-size: 13px; letter-spacing: .8px; }
    .title-text { fill: #24292f; font-size: 21px; font-weight: 700; }
    .body { fill: #57606a; font-size: 17px; }
    .prompt { fill: #0969da; font-size: 17px; font-weight: 700; }
    .ok { fill: #1a7f37; font-weight: 700; }
    .accent { fill: #8250df; }
    .line { opacity: 0; animation: reveal 8s ease-in-out infinite; }
    .l1 { animation-delay: .15s; }
    .l2 { animation-delay: .55s; }
    .l3 { animation-delay: .95s; }
    .l4 { animation-delay: 1.35s; }
    .l5 { animation-delay: 1.75s; }
    .ready { fill: #1a7f37; font-size: 18px; font-weight: 700; opacity: 0; animation: ready 8s ease-in-out infinite; }
    .cta { fill: #57606a; font-size: 14px; letter-spacing: 1.6px; opacity: 0; animation: cta 8s ease-in-out infinite; }
    .arrow { fill: #0969da; font-size: 22px; opacity: 0; animation: arrow 1.4s ease-in-out infinite; animation-delay: 3.8s; }
    .cursor { fill: #0969da; animation: blink .85s steps(1) infinite; }
    @keyframes reveal {
      0%, 5% { opacity: 0; transform: translateY(5px); }
      11%, 78% { opacity: 1; transform: translateY(0); }
      89%, 100% { opacity: 0; transform: translateY(-2px); }
    }
    @keyframes ready {
      0%, 40% { opacity: 0; transform: translateY(5px); }
      48%, 83% { opacity: 1; transform: translateY(0); }
      93%, 100% { opacity: 0; }
    }
    @keyframes cta {
      0%, 50% { opacity: 0; }
      58%, 85% { opacity: 1; }
      93%, 100% { opacity: 0; }
    }
    @keyframes arrow {
      0%, 100% { opacity: .35; transform: translateX(0); }
      50% { opacity: 1; transform: translateX(7px); }
    }
    @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .line, .ready, .cta, .arrow, .cursor { animation: none; opacity: 1; }
    }
  </style>

  <rect class="window" x="1" y="1" width="998" height="458" rx="18"/>
  <path class="bar" d="M19 2h962a18 18 0 0 1 18 18v31H1V20A18 18 0 0 1 19 2z"/>
  <line class="divider" x1="1" y1="52" x2="999" y2="52"/>
  <circle cx="24" cy="27" r="7" fill="#f85149"/>
  <circle cx="47" cy="27" r="7" fill="#d29922"/>
  <circle cx="70" cy="27" r="7" fill="#3fb950"/>
  <text class="mono meta" x="500" y="31" text-anchor="middle">pete@hometer  ·  AI product manager</text>

  <text class="mono title-text line l1" x="54" y="99">AI Product Manager Console</text>
  <text class="mono body line l2" x="54" y="143">[ <tspan class="ok">OK</tspan> ] product context loaded</text>
  <text class="mono prompt line l3" x="54" y="192">discover <tspan class="body">user problems · measurable outcomes</tspan></text>
  <text class="mono prompt line l4" x="54" y="231">evaluate <tspan class="body">model capability · product workflows</tspan></text>
  <text class="mono prompt line l5" x="54" y="286">pete@github ~ % <tspan class="body">open featured-projects</tspan><tspan class="cursor">_</tspan></text>

  <text class="mono ready" x="54" y="335">READY TO EXPLORE</text>
  <text class="mono cta" x="500" y="392" text-anchor="middle">CLICK TO VIEW REPOSITORIES</text>
  <text class="mono arrow" x="500" y="426" text-anchor="middle">→</text>
</svg>
